name: Deploy relay (dev)

# Pushes to main run the tests, apply D1 migrations, then deploy the dev Worker.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts, D1 and R2 edit)
# and CLOUDFLARE_ACCOUNT_ID. Worker secrets (RESEND_API_KEY, TYPESAFE_API_KEY, ...)
# stay in Cloudflare. The Mac daemon and Homebrew release are not part of this.
on:
  push:
    branches: [main]
    paths: [services/**, apps/**, wrangler.jsonc, package.json, package-lock.json, .github/workflows/deploy.yml]
  workflow_dispatch:

concurrency:
  group: deploy-relay-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply tagmails-relay-dev --remote --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
