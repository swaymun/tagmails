[package]
name = "tagmails-daemon"
version = "0.2.16"
edition = "2021"
description = "TagMails local agent: runs Codex or Claude Code for emails sent to your agent address"
license = "MIT"

[[bin]]
name = "tagmails"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0.151"
base64 = "0.22.1"
ring = "0.17.14"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
